<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Inter, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c9a96e"/>
    </marker>
  </defs>

  <!-- Left column: Ámbitos -->
  <!-- Title -->
  <text x="30" y="35" fill="#3d3229" font-size="17" font-weight="700" font-family="Libre Baskerville, serif">Ámbitos del motivo de poder</text>

  <!-- Level 1: Grupo de referencia próximo -->
  <rect x="30" y="60" width="280" height="85" rx="8" fill="#f5efe6" stroke="#c9a96e" stroke-width="1.5"/>
  <text x="170" y="85" text-anchor="middle" fill="#3d3229" font-size="14" font-weight="600">Grupo de referencia próximo</text>
  <text x="170" y="108" text-anchor="middle" fill="#706558" font-size="13">Familia · Amigos</text>
  <line x1="170" y1="118" x2="170" y2="130" stroke="#c9a96e" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Level 2: Esferas más alejadas -->
  <rect x="30" y="165" width="280" height="85" rx="8" fill="#f5efe6" stroke="#c9a96e" stroke-width="1.5"/>
  <text x="170" y="190" text-anchor="middle" fill="#3d3229" font-size="14" font-weight="600">Esferas más alejadas</text>
  <text x="170" y="213" text-anchor="middle" fill="#706558" font-size="13">Trabajo · Estudios</text>

  <!-- Level 3: Esferas lejanas -->
  <rect x="30" y="275" width="280" height="75" rx="8" fill="#f5efe6" stroke="#c9a96e" stroke-width="1.5"/>
  <text x="170" y="300" text-anchor="middle" fill="#3d3229" font-size="14" font-weight="600">Esferas lejanas</text>
  <text x="170" y="323" text-anchor="middle" fill="#706558" font-size="13">Desconocidos</text>

  <!-- Connecting vertical line between levels -->
  <line x1="170" y1="145" x2="170" y2="165" stroke="#3d3229" stroke-width="2"/>
  <line x1="170" y1="250" x2="170" y2="275" stroke="#3d3229" stroke-width="2"/>

  <!-- Right column: Annotations -->
  <!-- Bracket for levels 1 & 2 -->
  <path d="M 325 70 C 345 70 345 70 345 100 L 345 210 C 345 240 345 240 325 240" fill="none" stroke="#c9a96e" stroke-width="2"/>
  <!-- Horizontal line from bracket midpoint -->
  <line x1="345" y1="155" x2="420" y2="155" stroke="#c9a96e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Annotation box 1 -->
  <rect x="425" y="120" width="370" height="70" rx="8" fill="#3d3229"/>
  <text x="610" y="148" text-anchor="middle" fill="white" font-size="14" font-weight="600">Jerarquías implícitas</text>
  <text x="610" y="170" text-anchor="middle" fill="#e8d5a8" font-size="13">o explícitas del grupo</text>

  <!-- Arrow from level 3 to annotation 2 -->
  <line x1="310" y1="312" x2="420" y2="312" stroke="#c9a96e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Annotation box 2 -->
  <rect x="425" y="278" width="370" height="70" rx="8" fill="#3d3229"/>
  <text x="610" y="306" text-anchor="middle" fill="white" font-size="14" font-weight="600">Dominio, control y sumisión lejano</text>
  <text x="610" y="328" text-anchor="middle" fill="#e8d5a8" font-size="13">Ej: Guerra</text>
</svg>
