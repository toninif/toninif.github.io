<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350" font-family="Inter, sans-serif">
  <defs>
    <style>
      .caja-label { font-size: 14px; fill: #3d3229; font-weight: 600; text-anchor: middle; }
      .caja-sub { font-size: 11.5px; fill: #5a4a3a; text-anchor: middle; }
    </style>
    <marker id="flecha-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c9a96e"/>
    </marker>
  </defs>

  <!-- Caja 1: Libertad (izquierda arriba) -->
  <rect x="30" y="40" width="180" height="70" rx="8" fill="#f5efe6" stroke="#c9a96e" stroke-width="1.5"/>
  <text x="120" y="72" class="caja-label">Libertad</text>
  <text x="120" y="92" class="caja-sub">(creencia de control)</text>

  <!-- Caja 2: Pérdida o amenaza (derecha arriba) -->
  <rect x="540" y="40" width="180" height="70" rx="8" fill="#c9a96e" fill-opacity="0.2" stroke="#c9a96e" stroke-width="1.5"/>
  <text x="630" y="65" class="caja-label">Pérdida o amenaza</text>
  <text x="630" y="85" class="caja-sub">a la libertad</text>

  <!-- Caja 3: Reactancia (derecha abajo) -->
  <rect x="540" y="230" width="180" height="70" rx="8" fill="#3d3229" fill-opacity="0.08" stroke="#3d3229" stroke-width="1.5"/>
  <text x="630" y="258" class="caja-label">Reactancia</text>
  <text x="630" y="278" class="caja-sub">(estado motivacional)</text>

  <!-- Caja 4: Recuperación de libertad (izquierda abajo) -->
  <rect x="30" y="230" width="180" height="70" rx="8" fill="#f5efe6" stroke="#c9a96e" stroke-width="1.5"/>
  <text x="120" y="258" class="caja-label">Recuperación</text>
  <text x="120" y="278" class="caja-sub">de la libertad</text>

  <!-- Flecha 1: Libertad → Amenaza (arriba, izq → der) -->
  <line x1="210" y1="75" x2="537" y2="75" stroke="#c9a96e" stroke-width="2" marker-end="url(#flecha-r)"/>

  <!-- Flecha 2: Amenaza → Reactancia (derecha, arriba → abajo) -->
  <line x1="630" y1="110" x2="630" y2="227" stroke="#c9a96e" stroke-width="2" marker-end="url(#flecha-r)"/>

  <!-- Flecha 3: Reactancia → Recuperación (abajo, der → izq) -->
  <line x1="540" y1="265" x2="213" y2="265" stroke="#c9a96e" stroke-width="2" marker-end="url(#flecha-r)"/>

  <!-- Flecha 4: Recuperación → Libertad (izquierda, abajo → arriba) -->
  <line x1="120" y1="230" x2="120" y2="113" stroke="#c9a96e" stroke-width="2" marker-end="url(#flecha-r)"/>
</svg>
