project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!docs/**"
  resources:
    - "herramientas/**"
    - "robots.txt"

lang: es

website:
  title: "Fernando Tonini"
  site-url: "https://fernandotonini.com.ar"
  description: "Sitio profesional de Fernando Tonini, psicólogo, investigador y docente. Atención psicológica online, publicaciones y recursos académicos."
  open-graph: true
  twitter-card: true
  navbar:
    collapse-below: lg
    left:
      - href: index.qmd
        text: Inicio
      - href: atencion-psicologica/index.qmd
        text: Atención psicológica
      - href: docencia/index.qmd
        text: Docencia
      - href: investigacion/index.qmd
        text: Investigación
      - href: about.qmd
        text: Sobre mí
    right:
      - icon: github
        href: https://github.com/toninif
  page-footer:
    center: "2026 Fernando Tonini"

format:
  html:
    theme:
      - default
      - custom.scss
    include-in-header:
      - includes/google-site-verification.html
      - includes/schema-person.html
    canonical-url: true
    toc: false
